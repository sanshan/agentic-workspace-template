name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx sync:check
      - run: pnpm review:validate
      - run: pnpm nx run-many -t lint typecheck test build --parallel=2
      - name: Smoke test package and service generators
        run: |
          pnpm nx g @agentic-workspace/generators:package smoke-feature --dry-run --no-interactive
          pnpm nx g @agentic-workspace/generators:package smoke-feature --no-interactive
          pnpm nx g @agentic-workspace/generators:service smoke-service --dry-run --no-interactive
          pnpm nx g @agentic-workspace/generators:service smoke-service --no-interactive
          pnpm install --no-frozen-lockfile
          pnpm nx sync
          pnpm nx run-many -t lint typecheck build --projects=@agentic-workspace/smoke-feature,@agentic-workspace/smoke-service-service --parallel=2
  database-tests:
    name: Verify SQL adapters
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NX_DAEMON: 'false'
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: agentic-workspace
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agentic-workspace
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t test-integration --parallel=1
